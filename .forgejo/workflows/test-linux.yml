name: Linux tests

on:
  push:
    branches:
      - rope_dev
  pull_request:
    branches:
      - '*'

concurrency:
  group: test-linux-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux Py${{ matrix.PYTHON_VERSION }}
    runs-on: docker
    container:
      image: python:${{ matrix.PYTHON_VERSION }}-slim
    env:
      CI: 'true'
      OS: 'linux'
      PYTHON_VERSION: ${{ matrix.PYTHON_VERSION }}
    strategy:
      fail-fast: false
      matrix:
        PYTHON_VERSION: ['3.11', '3.12', '3.13', '3.14']
    timeout-minutes: 10
    steps:
      - name: Prepare container
        run: |
          apt-get update && apt-get install -y nodejs git
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: linux-${{ matrix.PYTHON_VERSION }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: linux-${{ matrix.PYTHON_VERSION }}-pip-
      - run: python -m pip install --upgrade pip setuptools
      - run: pip install -e .[all,test]
      - name: Show test environment
        run: pip list
      - run: pytest --color=yes -v test/
