[build-system]
requires = ["setuptools>=69.0.0", "setuptools_scm[toml]>=3.4.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rope-language-server"
authors = [{name = "Python Language Server Contributors"}]
description = "Python Language Server for the Language Server Protocol"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "docstring-to-markdown",
    "importlib_metadata>=4.8.3;python_version<\"3.10\"",
    "parso",
    "pluggy>=1.0.0",
    "python-lsp-jsonrpc>=1.1.0,<2.0.0",
    "rope>=1.11.0",
    "black"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/python-lsp/rope-language-server"

[project.optional-dependencies]
all = [
    "autopep8>=2.0.4,<2.1.0",
    "flake8>=7.1,<8",
    "mccabe>=0.7.0,<0.8.0",
    "pycodestyle>=2.12.0,<2.13.0",
    "pydocstyle>=6.3.0,<6.4.0",
    "pyflakes>=3.2.0,<3.3.0",
    "pylint>=3.1,<4.1.0",
    "rope>=1.11.0",
    "yapf>=0.33.0",
    "whatthepatch>=1.0.2,<2.0.0",
    "orjson>=3.0.0"
]
autopep8 = ["autopep8>=2.0.4,<2.1.0"]
flake8 = ["flake8>=7.1,<8"]
mccabe = ["mccabe>=0.7.0,<0.8.0"]
pycodestyle = ["pycodestyle>=2.12.0,<2.13.0"]
pydocstyle = ["pydocstyle>=6.3.0,<6.4.0"]
pyflakes = ["pyflakes>=3.2.0,<3.3.0"]
pylint = ["pylint>=3.1,<4.1.0"]
rope = ["rope>=1.11.0"]
yapf = ["yapf>=0.33.0", "whatthepatch>=1.0.2,<2.0.0"]
orjson = ["orjson>=3.0.0"]
websockets = ["websockets>=10.3"]
test = [
    "pylint>=3.1,<4.1.0",
    "pytest",
    "pytest-cov",
    "coverage",
    "numpy",
    "pandas",
    "matplotlib",
    "pyqt6",
    "flaky",
    "websockets>=10.3",
]

[project.entry-points.rols]
autopep8 = "rols.plugins.autopep8_format"
folding = "rols.plugins.folding"
flake8 = "rols.plugins.flake8_lint"
jedi_hover = "rols.plugins.hover"
jedi_highlight = "rols.plugins.highlight"
jedi_references = "rols.plugins.references"
jedi_rename = "rols.plugins.rope_rename"
jedi_signature_help = "rols.plugins.signature"
jedi_symbols = "rols.plugins.symbols"
mccabe = "rols.plugins.mccabe_lint"
preload = "rols.plugins.preload_imports"
pycodestyle = "rols.plugins.pycodestyle_lint"
pydocstyle = "rols.plugins.pydocstyle_lint"
pyflakes = "rols.plugins.pyflakes_lint"
pylint = "rols.plugins.pylint_lint"
rope_completion = "rols.plugins.rope_completion"
rope_autoimport = "rols.plugins.rope_autoimport"
rope_definition = "rols.plugins.rope_definition"
yapf = "rols.plugins.yapf_format"

[project.scripts]
rols = "rols.__main__:main"

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = ["contrib", "docs", "test", "test.*", "test.plugins", "test.plugins.*"]
namespaces = false

[tool.setuptools_scm]
write_to = "rols/_version.py"
write_to_template = "__version__ = \"{version}\"\n"  # VERSION_INFO is populated in __main__

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--cov-report html --cov-report term --junitxml=pytest.xml --cov rols --cov test"
filterwarnings = [
    "ignore::DeprecationWarning:rope.base.project",
    "ignore::DeprecationWarning:rope.base.libutils",
    "ignore::DeprecationWarning:rope.contrib.autoimport.sqlite",
]

[tool.coverage.run]
concurrency = ["multiprocessing", "thread"]
